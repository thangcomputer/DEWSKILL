<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Droplet Gradient -->
    <linearGradient id="dewGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="45%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Inner Glow Gradient -->
    <linearGradient id="innerGlow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </linearGradient>

    <!-- Bottom Soft Shadow -->
    <radialGradient id="bottomShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#064E3B" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#064E3B" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ground shadow for depth -->
  <ellipse cx="64" cy="120" rx="36" ry="6" fill="#047857" opacity="0.25" />

  <!-- Main Droplet Body -->
  <path
    d="M 64,8
       C 64,8 88,44 102,68
       C 114,88 108,114 88,122
       C 74,127 54,127 40,122
       C 20,114 14,88 26,68
       C 40,44 64,8 64,8 Z"
    fill="url(#dewGrad)"
  />

  <!-- Top highlight glint (glossy water shine) -->
  <path
    d="M 64,16
       C 64,16 48,46 36,68
       C 30,79 29,91 32,100
       C 30,90 32,77 40,64
       C 50,47 64,22 64,16 Z"
    fill="#FFFFFF"
    opacity="0.45"
  />

  <!-- Small top highlight oval -->
  <ellipse cx="56" cy="32" rx="4" ry="7" transform="rotate(-25 56 32)" fill="#FFFFFF" opacity="0.75" />

  <!-- Cheeks (Blush) -->
  <circle cx="42" cy="94" r="7" fill="#F472B6" opacity="0.6" />
  <circle cx="86" cy="94" r="7" fill="#F472B6" opacity="0.6" />

  <!-- Left Eye -->
  <ellipse cx="48" cy="82" rx="6.5" ry="9" fill="#064E3B" />
  <circle cx="46" cy="79" r="3" fill="#FFFFFF" />
  <circle cx="51" cy="86" r="1.3" fill="#FFFFFF" />

  <!-- Right Eye -->
  <ellipse cx="80" cy="82" rx="6.5" ry="9" fill="#064E3B" />
  <circle cx="78" cy="79" r="3" fill="#FFFFFF" />
  <circle cx="83" cy="86" r="1.3" fill="#FFFFFF" />

  <!-- Happy Smile -->
  <path
    d="M 56,92 Q 64,103 72,92"
    stroke="#064E3B"
    stroke-width="3.5"
    stroke-linecap="round"
    fill="none"
  />
</svg>
